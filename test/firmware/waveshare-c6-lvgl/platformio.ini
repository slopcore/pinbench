; Waveshare ESP32-C6-Touch-LCD-1.28 — the vendor's own Arduino LVGL demo.
;
; Everything in src/ is copied unmodified from
; github.com/waveshareteam/ESP32-C6-Touch-LCD-1.28,
; examples/Arduino-v3.2.1/07_LVGL_Demo: the sketch, GC9A01.{h,cpp} (esp_lcd SPI
; panel IO, DMA, hardware CS), CST816S.{h,cpp} (Wire touch, RISING ISR) and
; lv_conf.h (LVGL 8.4, lv_demo_widgets). Only the build is PlatformIO's.
;
; Same toolchain as ../waveshare-c6-lcd (see its platformio.ini): pioarduino
; 54.03.21 = Arduino 3.2.1, in its own core dir, esptool pinned to 5.1.0.
;   PLATFORMIO_CORE_DIR=~/.platformio-pioarduino pio run
[env:waveshare_c6_lvgl]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c6-devkitc-1
platform_packages =
  tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.1.0/esptool.zip
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
lib_deps =
  lvgl/lvgl@8.4.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  ; lv_conf.h lives next to the sketch, as in the Arduino IDE layout.
  -DLV_CONF_INCLUDE_SIMPLE
  -I src
