name: Release

# Manual only: Actions ▸ Release ▸ Run workflow (or `gh workflow run release.yml`).
#
# Collects every commit on main since the previous release tag (`v<semver>`),
# bumps the version, builds the macOS (Apple Silicon) .dmg, and publishes a
# GitHub Release tagged `v<version>` with grouped release notes and the .dmg
# attached. Fails early if nothing has been committed since the last release.
#
# Signing and notarization switch on when these repository secrets exist;
# without them the build is ad-hoc signed and not notarized:
#   MAC_CERT_P12_BASE64     Developer ID Application certificate + key, .p12, base64
#   MAC_CERT_PASSWORD       the .p12 export password
#   APPLE_API_KEY_P8        App Store Connect API key — the AuthKey_XXXX.p8 contents
#   APPLE_API_KEY_ID        its Key ID
#   APPLE_API_ISSUER        the Issuer ID
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the last release (ignored for the first release)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the GitHub Release

jobs:
  release:
    name: Build and release
    runs-on: macos-15 # Apple Silicon — the bundled QEMU is arm64
    timeout-minutes: 180
    if: github.ref == 'refs/heads/main'
    env:
      # electron-builder fetches its own Electron for packaging; skip npm's copy.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to find the previous release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Version, tag and notes, from the commits since the last release tag.
      - name: Plan release
        id: plan
        run: node --experimental-strip-types build/release.ts --bump "${{ inputs.bump }}" --notes "$RUNNER_TEMP/notes.md"

      - run: npm ci

      # Stamp the version into this checkout only (the app reads it at runtime,
      # electron-builder names the .dmg from it). The tag is the source of truth.
      - name: Set version
        run: npm version "${{ steps.plan.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      # QEMU's runtime libraries. Needed on a cache hit too: bundle-qemu.mjs
      # copies them out of /opt/homebrew into the app.
      - name: Install QEMU dependencies
        run: brew install ninja meson pkg-config glib pixman libgcrypt libgpg-error gnutls nettle libslirp

      - name: Runner image
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # Only the outputs bundle-qemu.mjs reads. The key covers the pinned fork
      # commit (setup-emulator.sh), PinBench's patch set (qemu/) and the runner
      # image, whose Homebrew versions the binaries link against.
      - name: Cache patched QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: |
            .qemu/build/qemu-system-xtensa
            .qemu/build/qemu-system-riscv32
            .qemu/pc-bios/esp*.bin
          key: qemu-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/setup-emulator.sh', 'qemu/**') }}

      - name: Build patched QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup-emulator.sh

      - name: Signing credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Package
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Stapling fetches the notarization ticket from api.apple-cloudkit.com,
        # which intermittently drops the connection ("Failed to staple … code:
        # 68"). Retry only that failure; anything else fails the step at once.
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/package.log"
          for attempt in 1 2 3; do
            if npm run dist:mac -- --publish never 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -q 'Failed to staple' "$log"; then
              exit 1
            fi
            echo "::warning::Stapling failed (attempt $attempt) — retrying in 60s"
            sleep 60
          done
          exit 1

      # Tags the commit this run built and publishes the release in one step.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.plan.outputs.tag }}" release/dist/*.dmg \
            --target "$GITHUB_SHA" \
            --title "PinBench ${{ steps.plan.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
