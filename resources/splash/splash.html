<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>PinBench</title>
    <style>
      /* The slopcore boot cover, as in bricktoucher: the bucket on --bg #07030f. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07030f;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
        cursor: default;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s;
      }
      body.out {
        opacity: 0;
      }
      img {
        width: 220px;
        height: auto;
        image-rendering: pixelated;
        animation: in 0.6s cubic-bezier(0.2, 0.9, 0.2, 1) both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: scale(1.12);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <img src="./slopcore.png" alt="" draggable="false" />
  </body>
</html>
