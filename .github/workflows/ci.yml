name: CI

# CI is disabled until the build is deployment-ready. Re-enable by restoring the
# push/pull_request triggers below. For now it only runs on manual dispatch.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Electron binary is only needed to run the app, never to typecheck, lint,
  # test or build it — and it is a 100 MB download per job.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the development target; Linux and Windows run from the start
        # so a platform-specific path or device-name assumption is caught on the
        # PR that introduces it rather than in the porting milestone.
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
