; Waveshare ESP32-S3-ETH + 1.28" round LCD (GC9A01) + Elatec TWN4 — the live
; fixture for boards/waveshare-esp32-s3-eth-gc9a01-twn4.board.json.
;
; Plain Arduino on PlatformIO's espressif32 platform (the one the other S3
; boards build with). Every SPI part is selected with a GPIO chip-select —
; PinBench routes SPI by the CS edges it sees, as an Arduino SPIClass driver
; produces them. The console is UART0 (GPIO43/44), not the S3's native USB.
;
;   pio run
;   esptool.py --chip esp32s3 merge_bin -o s3-eth-kit.bin --flash_mode dio \
;     --flash_size 16MB --fill-flash-size 16MB 0x0 bootloader.bin \
;     0x8000 partitions.bin 0xe000 boot_app0.bin 0x10000 firmware.bin
[env:s3_eth_kit]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
  arduino-libraries/Ethernet @ 2.0.2
