; Waveshare ESP32-C6-Touch-LCD-1.28 — LCD-only fixture for the C6 emulator path.
;
; The panel bring-up in src/main.cpp is Waveshare's own GC9A01.cpp
; (examples/Arduino-v3.2.1/07_LVGL_Demo) with LVGL taken out: the same esp_lcd
; SPI panel IO on SPI2_HOST with DMA and hardware CS, the same vendor init
; sequence, the same tx_color flush. It then paints known colours so a live test
; can assert pixels, and prints markers on UART0.
;
; ESP32-C6 needs Arduino-ESP32 3.x, which PlatformIO's own espressif32 platform
; does not ship — hence the pioarduino platform (54.03.21 = Arduino 3.2.1, the
; core Waveshare built against, and the last line PlatformIO Core 6.1.x can
; install), pinned by URL so the 6.11.0 platform the S3 boards build with is
; left alone.
;
; Build it with its own core dir — pioarduino's installer *replaces* the shared
; framework/esptool/toolchain packages the 6.11.0 platform depends on:
;   PLATFORMIO_CORE_DIR=~/.platformio-pioarduino pio run
[env:waveshare_c6_lcd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c6-devkitc-1
; 54.03.21 ships esptool 5.0.0-dev1, which breaks under click >= 8.2 (the
; PlatformIO venv has 8.3): ParamType.get_metavar() grew a ctx argument.
platform_packages =
  tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.1.0/esptool.zip
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
build_flags =
  ; Serial on UART0 (GPIO16/17), not USB-Serial-JTAG, so PinBench's console sees it.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
